name: Test accès API-Football

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger API-Football depuis GitHub
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          cat > test.mjs <<'EOF'
          const key = process.env.API_FOOTBALL_KEY;
          if (!key) {
            console.log("ERREUR : le secret API_FOOTBALL_KEY est absent ou vide.");
            process.exit(1);
          }
          console.log("Clé trouvée (" + key.length + " caractères). Appel en cours...");
          const url = "https://v3.football.api-sports.io/players?league=61&season=2024&page=1";
          const r = await fetch(url, { headers: { "x-apisports-key": key } });
          const j = await r.json().catch(() => null);
          console.log("Statut HTTP : " + r.status);
          const errs = j && j.errors;
          const hasErr = errs && (Array.isArray(errs) ? errs.length : Object.keys(errs).length);
          if (hasErr) {
            console.log("REFUSE — API-Football repond : " + JSON.stringify(errs));
            process.exit(1);
          }
          console.log("Joueurs sur cette page : " + j.results);
          console.log("Pages au total pour cette ligue/saison : " + (j.paging && j.paging.total));
          const p = j.response && j.response[0];
          if (p) {
            console.log("Exemple : " + p.player.name + ", " + p.player.age + " ans");
            console.log("Blocs de statistiques pour ce joueur : " + p.statistics.length);
            const s = p.statistics[0];
            if (s) {
              console.log("  club : " + (s.team && s.team.name));
              console.log("  matchs : " + (s.games && s.games.appearences));
              console.log("  buts : " + (s.goals && s.goals.total));
            }
          }
          console.log("");
          console.log("SUCCES : les serveurs GitHub passent le pare-feu.");
          EOF
          node test.mjs
