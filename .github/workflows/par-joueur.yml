name: Réorganiser par joueur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regrouper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regrouper par joueur
        run: |
          cat > regroupe.mjs <<'EOF'
          import { readdirSync, readFileSync, writeFileSync, mkdirSync, rmSync, existsSync } from "node:fs";
          import { gzipSync } from "node:zlib";

          const SOURCE = "www/data/stats";
          const SORTIE = "www/data/players";
          const RECHERCHE = "www/data/search.json";
          const NB_PAQUETS = 1000;

          const fichiers = readdirSync(SOURCE).filter(f => f.endsWith(".json")).sort();
          console.log(fichiers.length + " fichiers source");

          const joueurs = new Map();
          let blocs = 0, doublons = 0;

          for (const f of fichiers) {
            const doc = JSON.parse(readFileSync(SOURCE + "/" + f, "utf8"));
            const saison = doc.season;
            for (const p of doc.players || []) {
              let j = joueurs.get(p.i);
              if (!j) { j = { i: p.i, n: p.n, a: p.a, c: p.c, s: {} }; joueurs.set(p.i, j); }
              const liste = j.s[saison] || (j.s[saison] = []);
              for (const st of p.s || []) {
                const cle = (st.league && st.league.id) + "/" + (st.team && st.team.id);
                if (liste.some(x => ((x.league && x.league.id) + "/" + (x.team && x.team.id)) === cle)) { doublons++; continue; }
                liste.push(st);
                blocs++;
              }
            }
          }
          console.log(joueurs.size + " joueurs uniques");

          if (existsSync(SORTIE)) rmSync(SORTIE, { recursive: true });
          mkdirSync(SORTIE, { recursive: true });

          const paquets = Array.from({ length: NB_PAQUETS }, () => []);
          for (const j of joueurs.values()) paquets[j.i % NB_PAQUETS].push(j);

          let octets = 0, pleins = 0, plusGros = 0;
          paquets.forEach((liste, n) => {
            if (!liste.length) return;
            const txt = JSON.stringify(liste);
            writeFileSync(SORTIE + "/" + n + ".json", txt);
            octets += txt.length; pleins++;
            if (txt.length > plusGros) plusGros = txt.length;
          });
          writeFileSync(SORTIE + "/index.json", JSON.stringify({
            paquets: NB_PAQUETS, joueurs: joueurs.size, blocs, genere: new Date().toISOString()
          }));

          // ---- Index de recherche, au format attendu par l'application ----
          const posCode = p => {
            const s = (p || "").toLowerCase();
            if (s.includes("goal")) return "GK";
            if (s.includes("def")) return "DEF";
            if (s.includes("mid")) return "MID";
            return "FWD";
          };
          // Le club affiché dans la recherche doit être un club, pas une sélection :
          // sans ce filtre, Ronaldo s'affichait « Portugal » et Messi « Argentine »,
          // parce que la première équipe rencontrée en remontant les saisons pouvait
          // être l'équipe nationale.
          const _norm = v => String(v || "").normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
          const estSelection = (st, nationalite) => {
            const t = st.team || {}, lg = st.league || {};
            if (t.national === true) return true;
            const tn = _norm(t.name), nat = _norm(nationalite);
            if (nat && tn === nat) return true;
            const ln = _norm(lg.name);
            return /world cup|euro|nations league|copa america|africa cup|asian cup|gold cup|confederations|friendlies|qualification/.test(ln)
                && !/club|champions|europa|conference|libertadores/.test(ln);
          };

          // Cherche le club le plus récent dans une fiche {s:{saison:[blocs]}}
          const dernierClub = (fiche, nationalite) => {
            let poste = null, club = null, clubId = null;
            for (const sn of Object.keys(fiche.s || {}).map(Number).sort((a, b) => b - a)) {
              for (const st of fiche.s[sn] || []) {
                if (!poste && st.games && st.games.position) poste = st.games.position;
                if (!club && st.team && st.team.name && !estSelection(st, nationalite)) {
                  club = st.team.name; clubId = st.team.id;
                }
              }
              if (poste && club) break;
            }
            return { poste, club, clubId };
          };

          const FULL = "www/data/full";
          let viaCarriere = 0;
          const avecCarriere = new Set();   // les joueurs du petit index

          const recherche = [];
          for (const j of joueurs.values()) {
            // La carrière complète d'abord : elle couvre les championnats absents de
            // data/stats. Sans elle, Ronaldo ressort « Manchester United » et Messi
            // « Paris Saint Germain », faute de Saudi Pro League et de MLS.
            let poste = null, club = null, clubId = null, matchs = 0;
            const cheminFull = FULL + "/" + j.i + ".json";
            if (existsSync(cheminFull)) {
              try {
                const f = JSON.parse(readFileSync(cheminFull, "utf8"));
                const r = dernierClub(f, f.c || j.c);
                poste = r.poste; club = r.club; clubId = r.clubId;
                if (club) viaCarriere++;
                avecCarriere.add(j.i);
                // Total des matchs joues sur toute la carriere. C'est le seul signal de
                // notoriete dont on dispose, et il sert a classer les resultats de
                // recherche : sans lui, taper « salah » remontait I. Salah avant Mohamed
                // Salah, et « kane » C. Kane avant Harry Kane, l'index etant trie par
                // ordre alphabetique puis par longueur du nom.
                for (const saison of Object.values(f.s || {}))
                  for (const bloc of (saison || []))
                    matchs += ((bloc.games && bloc.games.appearences) || 0);
              } catch (e) { /* fichier illisible : on retombe sur les paquets */ }
            }
            if (!club || !poste) {
              const r = dernierClub(j, j.c);
              poste = poste || r.poste; 
              if (!club) { club = r.club; clubId = r.clubId; }
            }
            recherche.push({ i: j.i, n: j.n || "", f: "", l: "", a: j.a || null,
                             c: j.c || "", p: posCode(poste), t: club || "", ti: clubId || null,
                             m: matchs || 0 });
          }
          recherche.sort((a, b) => (a.n || "").localeCompare(b.n || ""));
          const txtRecherche = JSON.stringify({
            v: 1, updatedAt: new Date().toISOString(),
            count: recherche.length, players: recherche
          });
          writeFileSync(RECHERCHE, txtRecherche);

          // Index réduit aux joueurs dont on a la carrière complète. Quelques
          // centaines de kilo-octets au lieu de cinq mégaoctets : l'application le
          // charge d'abord, la recherche des joueurs connus marche tout de suite,
          // et le gros index arrive derrière sans que personne ne l'attende.
          const RECHERCHE_TOP = "www/data/search-top.json";
          const top = recherche.filter(e => avecCarriere.has(e.i));
          const txtTop = JSON.stringify({
            v: 1, updatedAt: new Date().toISOString(),
            count: top.length, partiel: true, players: top
          });
          writeFileSync(RECHERCHE_TOP, txtTop);

          // Index decoupe par initiale. L'index complet pese 1,1 Mo compresse : des
          // qu'une recherche ne trouvait rien dans l'index court, le telephone
          // telechargeait ce megaoctet entier, soit une dizaine de secondes en 3G.
          // Chaque joueur est range sous l'initiale de CHACUN de ses mots d'au moins
          // deux lettres, ce qui correspond exactement a ce que la recherche compare.
          // Les initiales isolees (« E. ») sont ignorees : on ne cherche jamais sur une
          // seule lettre, et les inclure gonflait les tranches d'un tiers.
          const AZ = "www/data/search-az";
          rmSync(AZ, { recursive: true, force: true });
          mkdirSync(AZ, { recursive: true });
          const SPECIALES = { "\u00f8":"o", "\u00e5":"a", "\u00e6":"a", "\u0153":"o",
                              "\u00df":"s", "\u0111":"d", "\u0142":"l", "\u00f0":"d",
                              "\u00fe":"t", "\u0127":"h", "\u0131":"i" };
          const sansAccent = (t) => String(t || "").normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "").toLowerCase()
            .replace(/[\u00f8\u00e5\u00e6\u0153\u00df\u0111\u0142\u00f0\u00fe\u0127\u0131]/g,
                     (c) => SPECIALES[c] || c);
          const tranches = new Map();
          for (const e of recherche) {
            const mots = sansAccent(e.n).split(/[^a-z0-9]+/).filter((w) => w.length >= 2);
            const cles = new Set(mots.map((w) => (/[a-z]/.test(w[0]) ? w[0] : "0")));
            if (!cles.size) cles.add("0");
            for (const c of cles) {
              if (!tranches.has(c)) tranches.set(c, []);
              tranches.get(c).push(e);
            }
          }
          let azOctets = 0, azMax = 0, azMaxNom = "";
          for (const [c, liste] of [...tranches].sort()) {
            const txt = JSON.stringify({ v: 1, tranche: c, count: liste.length, players: liste });
            writeFileSync(AZ + "/" + c + ".json", txt);
            const comp = gzipSync(txt).length;
            azOctets += comp;
            if (comp > azMax) { azMax = comp; azMaxNom = c; }
          }
          writeFileSync(AZ + "/index.json", JSON.stringify({
            v: 1, updatedAt: new Date().toISOString(),
            tranches: [...tranches.keys()].sort()
          }));

          console.log("");
          console.log("RESULTATS");
          console.log("  joueurs uniques : " + joueurs.size);
          console.log("  blocs de stats  : " + blocs + " (doublons ecartes : " + doublons + ")");
          console.log("  paquets ecrits  : " + pleins + " / " + NB_PAQUETS);
          console.log("  taille paquets  : " + Math.round(octets / 1048576) + " Mo, plus gros " + Math.round(plusGros / 1024) + " Ko");
          console.log("  club via carriere: " + viaCarriere);
          console.log("  index court     : " + top.length + " joueurs, "
                      + Math.round(txtTop.length / 1024) + " Ko brut, "
                      + Math.round(gzipSync(txtTop).length / 1024) + " Ko compresse");
          console.log("  index recherche : " + Math.round(txtRecherche.length / 1024) + " Ko brut, "
                      + Math.round(gzipSync(txtRecherche).length / 1024) + " Ko compresse");
          console.log("  tranches A-Z    : " + tranches.size + " fichiers, "
                      + Math.round(azOctets / 1024) + " Ko compresses au total, "
                      + "plus grosse « " + azMaxNom + " » " + Math.round(azMax / 1024) + " Ko");
          EOF
          node --max-old-space-size=8192 regroupe.mjs

      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A www/data/players www/data/search.json www/data/search-top.json www/data/search-az
          git diff --staged --quiet || git commit -m "Paquets par joueur et index de recherche"
          git push
