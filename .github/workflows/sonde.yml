name: Sonde qualité des données

on:
  workflow_dispatch:

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          cat > sonde.mjs <<'EOF'
          const KEY = process.env.API_FOOTBALL_KEY;
          const BASE = "https://v3.football.api-sports.io";
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const get = async p => {
            const r = await fetch(BASE + p, { headers: { "x-apisports-key": KEY } });
            return r.json();
          };
          const remplis = o => Object.entries(o || {})
            .filter(([k, v]) => v !== null && v !== undefined).map(([k]) => k);
          const vides = o => Object.entries(o || {})
            .filter(([k, v]) => v === null || v === undefined).map(([k]) => k);

          function decrire(titre, st) {
            console.log("--- " + titre + " ---");
            if (!st) { console.log("  aucune donnee"); return; }
            for (const bloc of ["games", "shots", "goals", "passes", "tackles", "duels", "dribbles", "fouls", "cards"]) {
              const o = st[bloc] || {};
              const r = remplis(o), v = vides(o);
              console.log("  " + bloc.padEnd(10) + " rempli: " + (r.join(",") || "-"));
              if (v.length) console.log("  " + " ".repeat(10) + " VIDE  : " + v.join(","));
            }
            console.log("");
          }

          // 1. Saison ancienne, grand championnat
          let j = await get("/players?league=140&season=2012&page=1");
          let p = j.response && j.response[0];
          console.log("LIGA 2012 — joueurs sur la page : " + (j.results || 0));
          if (p) { console.log("exemple : " + p.player.name); decrire("Liga 2012", p.statistics[0]); }
          await sleep(1000);

          // 2. Saison recente, petit championnat
          j = await get("/players?league=94&season=2024&page=1");
          p = j.response && j.response[0];
          console.log("PORTUGAL 2024 — joueurs sur la page : " + (j.results || 0));
          if (p) { console.log("exemple : " + p.player.name); decrire("Portugal 2024", p.statistics[0]); }
          await sleep(1000);

          // 3. LE POINT CLE : par championnat contre par joueur
          j = await get("/players?league=61&season=2024&page=1");
          p = j.response && j.response[0];
          if (p) {
            const id = p.player.id;
            console.log("COMPARAISON pour " + p.player.name + " (id " + id + ")");
            console.log("  via le championnat : " + p.statistics.length + " bloc(s)");
            p.statistics.forEach(s => console.log("     - " + (s.league && s.league.name)));
            await sleep(1000);
            const j2 = await get("/players?id=" + id + "&season=2024");
            const p2 = j2.response && j2.response[0];
            console.log("  via le joueur      : " + (p2 ? p2.statistics.length : 0) + " bloc(s)");
            if (p2) p2.statistics.forEach(s => console.log("     - " + (s.league && s.league.name)));
          }
          EOF
          node sonde.mjs
