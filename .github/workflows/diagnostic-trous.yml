name: Diagnostic des saisons manquantes

# Ne modifie AUCUN fichier. Ce workflow pose une seule question à API-Football :
# les saisons absentes de nos carrières, l'API les possède-t-elle ou non ?
#
# Deux cas très différents se cachent derrière « il manque une saison » :
#   - l'API connaît la saison et sait la restituer : c'est nous qui l'avons perdue,
#     et c'est donc récupérable ;
#   - l'API ne connaît pas la saison : rien ne la récupérera sur cette source.
#
# Le résultat s'affiche dans le résumé de l'exécution, rien n'est publié.

on:
  workflow_dispatch:
    inputs:
      echantillon_debuts:
        description: "Nombre de joueurs au début tardif à sonder (0 = aucun)"
        default: "150"

permissions:
  contents: read

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            www/data/full
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Interroger l'API
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ECHANTILLON: ${{ inputs.echantillon_debuts || '150' }}
        run: |
          cat > sonde.mjs <<'EOF'
          import { readdirSync, readFileSync, appendFileSync } from "node:fs";

          const KEY  = process.env.API_FOOTBALL_KEY;
          const BASE = "https://v3.football.api-sports.io";
          const ECH  = parseInt(process.env.ECHANTILLON || "150", 10);
          const PAUSE = 220;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          let appels = 0;

          async function get(chemin, tries = 4) {
            for (let i = 1; i <= tries; i++) {
              appels++;
              const r = await fetch(BASE + chemin, { headers: { "x-apisports-key": KEY } });
              if (r.ok) return r.json();
              if (i === tries) throw new Error(`${chemin} : HTTP ${r.status}`);
              await sleep(1200 * i);
            }
          }

          // ---- Lecture de nos carrières ---------------------------------------
          const DOSSIER = "www/data/full";
          const fiches = readdirSync(DOSSIER)
            .filter((f) => /^\d+\.json$/.test(f))
            .map((f) => JSON.parse(readFileSync(`${DOSSIER}/${f}`, "utf8")));
          console.log(`carrieres lues : ${fiches.length}`);

          const trous = [];      // { id, nom, annee }
          const tardifs = [];    // { id, nom, premiere, age }
          for (const f of fiches) {
            const ans = Object.keys(f.s || {}).map(Number).sort((a, b) => a - b);
            if (!ans.length) continue;
            const vus = new Set(ans);
            for (let y = ans[0]; y <= ans[ans.length - 1]; y++) {
              if (!vus.has(y)) trous.push({ id: f.i, nom: f.n, annee: y });
            }
            if (f.a && ans[0] - (2026 - f.a) >= 20) {
              tardifs.push({ id: f.i, nom: f.n, premiere: ans[0], age: f.a });
            }
          }
          console.log(`trous au milieu : ${trous.length}`);
          console.log(`debuts tardifs  : ${tardifs.length}`);

          // ---- 1. Les trous du milieu sont-ils récupérables ? -----------------
          // Une seule requête /players/seasons par joueur, mise en cache.
          const cacheSaisons = new Map();
          async function saisonsConnues(id) {
            if (!cacheSaisons.has(id)) {
              const r = await get("/players/seasons?player=" + id);
              await sleep(PAUSE);
              cacheSaisons.set(id, new Set((r.response || []).map(Number)));
            }
            return cacheSaisons.get(id);
          }

          let inconnueDeLApi = 0, connueEtVide = 0, recuperable = 0;
          const exRecup = [], exInconnue = [];
          for (const t of trous) {
            try {
              const connues = await saisonsConnues(t.id);
              if (!connues.has(t.annee)) {
                inconnueDeLApi++;
                if (exInconnue.length < 6) exInconnue.push(`${t.nom} ${t.annee}`);
                continue;
              }
              const j = await get(`/players?id=${t.id}&season=${t.annee}`);
              await sleep(PAUSE);
              const row = (j.response || [])[0];
              if (row && row.statistics && row.statistics.length) {
                recuperable++;
                if (exRecup.length < 8) {
                  const m = row.statistics.reduce(
                    (s, b) => s + ((b.games || {}).appearences || 0), 0);
                  exRecup.push(`${t.nom} ${t.annee} : ${row.statistics.length} blocs, ${m} matchs`);
                }
              } else {
                connueEtVide++;
              }
            } catch (e) {
              console.log(`echec ${t.nom} ${t.annee} : ${e.message}`);
            }
          }

          // ---- 2. Les débuts de carrière manquants existent-ils ? -------------
          // On demande à l'API la liste de ses saisons et on regarde si elle en
          // connaît d'antérieures à notre première.
          let sondes = 0, apiEnSaitPlus = 0, saisonsEnPlus = 0;
          const exPlus = [];
          for (const p of tardifs.slice(0, ECH)) {
            try {
              const connues = [...(await saisonsConnues(p.id))].sort((a, b) => a - b);
              sondes++;
              const avant = connues.filter((y) => y < p.premiere);
              if (avant.length) {
                apiEnSaitPlus++;
                saisonsEnPlus += avant.length;
                if (exPlus.length < 8) {
                  exPlus.push(`${p.nom} : nous commençons en ${p.premiere}, `
                            + `l'API connaît aussi ${avant.join(", ")}`);
                }
              }
            } catch (e) {
              console.log(`echec sondage ${p.nom} : ${e.message}`);
            }
          }

          // ---- Rapport --------------------------------------------------------
          const L = [];
          const dire = (s) => { L.push(s); console.log(s); };
          dire("## Diagnostic des saisons manquantes");
          dire("");
          dire(`Carrières examinées : **${fiches.length}**. Appels API : **${appels}**.`);
          dire("");
          dire("### 1. Trous au milieu de carrière");
          dire("");
          dire(`Années manquantes examinées : **${trous.length}**`);
          dire("");
          dire("| verdict | nombre |");
          dire("|---|---|");
          dire(`| récupérable — l'API a la saison et renvoie des stats | **${recuperable}** |`);
          dire(`| perdu — l'API ne connaît pas cette saison du joueur | ${inconnueDeLApi} |`);
          dire(`| perdu — l'API connaît la saison mais ne renvoie rien | ${connueEtVide} |`);
          dire("");
          if (exRecup.length) {
            dire("Exemples récupérables :");
            dire("");
            for (const e of exRecup) dire(`- ${e}`);
            dire("");
          }
          if (exInconnue.length) {
            dire("Exemples définitivement absents : " + exInconnue.join(" · "));
            dire("");
          }
          dire("### 2. Débuts de carrière");
          dire("");
          dire(`Joueurs sondés (première saison à 20 ans ou plus) : **${sondes}**`);
          dire(`Pour lesquels l'API connaît des saisons plus anciennes : **${apiEnSaitPlus}**`);
          dire(`Saisons antérieures que l'API possède et que nous n'avons pas : **${saisonsEnPlus}**`);
          dire("");
          if (exPlus.length) {
            for (const e of exPlus) dire(`- ${e}`);
          } else {
            dire("Aucune : pour ces joueurs, l'API ne remonte pas plus loin que nous.");
          }
          dire("");
          dire("_Aucun fichier n'a été modifié par cette exécution._");

          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join("\n") + "\n");
          }
          EOF
          node sonde.mjs
