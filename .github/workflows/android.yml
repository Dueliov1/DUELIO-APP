name: Compiler l'app Android

on:
  workflow_dispatch:
    inputs:
      type:
        description: "debug (APK de test) ou release (AAB signé pour le Play Store)"
        default: "debug"
      versionName:
        description: "Numéro de version affiché (ex. 1.0.0)"
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      # Le projet Android est régénéré à chaque compilation (il n'est pas versionné) :
      # sans cette étape, l'application sortait avec l'icône grise par défaut de Capacitor.
      - name: Poser l'icône et l'écran de démarrage
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp branding/icones/ic_launcher-$d.png "$RES/mipmap-$d/ic_launcher.png"
            cp branding/icones/ic_launcher-$d.png "$RES/mipmap-$d/ic_launcher_round.png"
            cp branding/icones/fg-$d.png          "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/values"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><color name="ic_launcher_background">#0B1730</color></resources>' > "$RES/values/ic_launcher_background.xml"
          for d in drawable drawable-port-xxxhdpi drawable-land-xxxhdpi; do
            [ -d "$RES/$d" ] && cp branding/icones/splash.png "$RES/$d/splash.png"
          done
          echo "Icônes posées :"; ls -la "$RES/mipmap-xxxhdpi/"

      # Le Play Store refuse deux envois portant le même numéro : il s'incrémente tout seul.
      - name: Numéro de version
        env:
          VN: ${{ inputs.versionName }}
          VC: ${{ github.run_number }}
        run: |
          sed -i "s/versionCode .*/versionCode ${VC}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${VN:-1.0.0}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Notifications (Firebase Cloud Messaging). Le fichier google-services.json
      # vient du projet Firebase (Paramètres du projet → Vos applications → Android,
      # package app.duelio) et est stocké dans le secret GOOGLE_SERVICES_JSON.
      # Sans ce secret, l'application se compile quand même, sans notifications.
      - name: Brancher Firebase (notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON absent : APK sans notifications."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # Le plugin Gradle de Google Services, une seule fois chacun.
          grep -q "com.google.gms:google-services" android/build.gradle || \
            sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || \
            printf "\napply plugin: 'com.google.gms.google-services'\n" >> android/app/build.gradle
          echo "Firebase branché."

      # Capacitor recopie tout www/ dans l'APK, base de données comprise :
      # 417 Mo de JSON qui ne seraient jamais lus, puisque l'application
      # appelle ses données par leur adresse complète sur Cloudflare. On les
      # retire, et on vérifie qu'il ne reste que l'interface.
      - name: Retirer la base de données de l'APK
        run: |
          CIBLE=android/app/src/main/assets/public
          echo "Avant : $(du -sh $CIBLE | cut -f1)"
          rm -rf "$CIBLE/data"
          # Les photos des légendes aussi : l'application les appelle par leur
          # adresse complète sur Cloudflare, jamais depuis l'APK (672 Ko).
          rm -rf "$CIBLE/legendes"
          echo "Après : $(du -sh $CIBLE | cut -f1)"
          echo "Contenu embarqué :"
          ls -la "$CIBLE"

      # --- Compilation de test : un APK qu'on installe à la main sur un téléphone ---
      - name: Compiler l'APK de test
        if: ${{ inputs.type != 'release' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK de test
        if: ${{ inputs.type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: duelio-apk-test
          path: android/app/build/outputs/apk/debug/*.apk

      # --- Compilation de publication : l'AAB signé qu'attend le Play Store ---
      # Quatre secrets nécessaires : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Sans eux, l'étape s'arrête en l'expliquant.
      - name: Signer et compiler l'AAB
        if: ${{ inputs.type == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Clé de signature absente. Ajoutez les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload.keystore
          {
            echo ""
            echo "android {"
            echo "    signingConfigs {"
            echo "        release {"
            echo "            storeFile file('upload.keystore')"
            echo "            storePassword System.getenv('KEYSTORE_PASSWORD')"
            echo "            keyAlias System.getenv('KEY_ALIAS')"
            echo "            keyPassword System.getenv('KEY_PASSWORD')"
            echo "        }"
            echo "    }"
            echo "    buildTypes { release { signingConfig signingConfigs.release } }"
            echo "}"
          } >> android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ls -lh app/build/outputs/bundle/release/*.aab
          rm -f app/upload.keystore

      - name: Publier l'AAB
        if: ${{ inputs.type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: duelio-aab-playstore
          path: android/app/build/outputs/bundle/release/*.aab
