name: Sonde du proxy

# Interroge le Worker duelio-proxy en ligne pour savoir ce qui y est réellement déployé
# (comptes, base D1, e-mails). Rapport dans diagnostics/sonde-proxy.txt.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sonder
        run: |
          B=https://duelio-proxy.bensouna-ahmed.workers.dev
          {
            echo "== /diag =="; curl -sS -m 20 "$B/diag" | head -c 1500; echo
            echo "== GET /auth/me (attendu : 401 ou JSON ok:false si les comptes existent, 404/texte sinon) =="
            curl -sS -m 20 -o /tmp/me.txt -w "HTTP %{http_code}\n" "$B/auth/me"; head -c 400 /tmp/me.txt; echo
            echo "== POST /auth/login vide (dit si la base D1 répond) =="
            curl -sS -m 20 -o /tmp/login.txt -w "HTTP %{http_code}\n" -X POST -H 'content-type: application/json' -d '{}' "$B/auth/login"; head -c 400 /tmp/login.txt; echo
            echo "== POST /auth/register e-mail invalide (dit si la route existe) =="
            curl -sS -m 20 -o /tmp/reg.txt -w "HTTP %{http_code}\n" -X POST -H 'content-type: application/json' -d '{"email":"x","password":"y"}' "$B/auth/register"; head -c 400 /tmp/reg.txt; echo
            echo "== GET /favorites sans session =="
            curl -sS -m 20 -o /tmp/fav.txt -w "HTTP %{http_code}\n" "$B/favorites"; head -c 400 /tmp/fav.txt; echo
          } > diagnostics/sonde-proxy.txt 2>&1
          cat diagnostics/sonde-proxy.txt
      - name: Publier
        run: |
          git config user.name "sonde"; git config user.email "sonde@users.noreply.github.com"
          git add diagnostics/sonde-proxy.txt; git commit -m "Sonde du proxy" || echo rien
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
