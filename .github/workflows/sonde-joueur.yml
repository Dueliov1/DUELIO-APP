name: Sonde joueur

# Cherche un nom dans la source (API-Football) : le joueur existe-t-il, quels clubs et quelles ligues sont couverts ?

on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Nom à chercher"
        required: true
        default: "Brrou"

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chercher
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NOM: ${{ github.event.inputs.nom }}
        run: |
          cat > sonde.mjs <<'EOS'
          import { writeFileSync, mkdirSync } from "node:fs";
          const sortie = []; const dire = t => { sortie.push(t); console.log(t); };
          const H = { headers: { "x-apisports-key": process.env.API_FOOTBALL_KEY } };
          const nom = process.env.NOM;
          const get = async u => { const r = await fetch("https://v3.football.api-sports.io" + u, H); return r.json(); };
          const p = await get(`/players/profiles?search=${encodeURIComponent(nom)}`);
          dire(`profils pour « ${nom} » : ${(p.response || []).length} ${JSON.stringify(p.errors || {})}`);
          for (const e of (p.response || []).slice(0, 10)) dire(`  ${e.player.id} ${e.player.firstname} ${e.player.lastname} (${e.player.nationality}, né ${e.player.birth && e.player.birth.date})`);
          const t = await get(`/players?search=${encodeURIComponent(nom)}&league=144`);
          dire(`\nrecherche dans la ligue 144 (Jupiler Pro League) : ${(t.response || []).length}`);
          const c = await get(`/leagues?search=challenger`);
          for (const l of (c.response || [])) dire(`\nligue ${l.league.id} ${l.league.name} (${l.country.name}) — saisons avec joueurs: ${(l.seasons || []).filter(s => s.coverage && s.coverage.players).map(s => s.year).join(",") || "aucune"}`);
          mkdirSync("diagnostics", { recursive: true });
          writeFileSync("diagnostics/recherche-joueur.txt", sortie.join("\n") + "\n");
          EOS
          node sonde.mjs
          rm sonde.mjs
      - name: Publier le rapport
        run: |
          git config user.name "sonde"; git config user.email "sonde@users.noreply.github.com"
          git add diagnostics/recherche-joueur.txt
          git commit -m "Rapport recherche joueur" || echo rien
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
