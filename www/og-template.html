<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;height:630px;overflow:hidden;background:#0B1730;
       font-family:'Plus Jakarta Sans',sans-serif;position:relative;}
  /* marquage de terrain, repris de l'application */
  .pitch{position:absolute;inset:0;opacity:.3;}
  .pitch div{position:absolute;border:2px solid #2C4272;}
  .halfway{left:50%;top:0;bottom:0;width:0;border-left:2px solid #2C4272;border-top:none;border-right:none;border-bottom:none;}
  .circle{left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;}
  .boxL{left:-2px;top:50%;width:150px;height:300px;margin-top:-150px;border-left:none;}
  .boxR{right:-2px;top:50%;width:150px;height:300px;margin-top:-150px;border-right:none;}
  .glow{position:absolute;left:-180px;top:-200px;width:760px;height:760px;border-radius:50%;
        background:radial-gradient(circle,rgba(34,211,238,.17) 0%,rgba(34,211,238,0) 62%);}
  .wrap{position:relative;height:100%;padding:62px 70px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:16px;}
  .brand img{width:62px;height:auto;}
  .brand span{font-family:'Unbounded',sans-serif;font-weight:800;font-size:42px;color:#fff;letter-spacing:-.01em;}
  .body{flex:1;display:flex;align-items:center;gap:60px;margin-top:6px;}
  .left{flex:1;min-width:0;}
  h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:68px;line-height:1.04;color:#fff;letter-spacing:-.02em;}
  h1 em{font-style:normal;color:#22D3EE;}
  p{margin-top:24px;font-size:27px;line-height:1.38;color:#A9CFC5;font-weight:500;max-width:19ch;}
  .card{width:430px;flex-shrink:0;background:rgba(22,35,74,.9);border:1px solid #2C4272;
        border-radius:26px;padding:24px 24px 20px;}
  .heads{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .who{flex:1;text-align:center;}
  .who img{width:74px;height:74px;border-radius:50%;background:#0B1730;
           border:2px solid #2C4272;display:block;margin:0 auto 9px;}
  .who.a img{border-color:rgba(47,232,138,.55);}
  .who span{display:block;font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;color:#fff;}
  .vs{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:#0B1730;border:1px solid #2C4272;
      display:flex;align-items:center;justify-content:center;
      font-family:'Unbounded',sans-serif;font-weight:800;font-size:14px;color:#A9CFC5;}
  .row{margin-bottom:11px;}
  .lbl{text-align:center;font-size:14px;font-weight:600;color:#A9CFC5;margin-bottom:7px;}
  .vals{display:flex;gap:14px;}
  .v{flex:1;height:58px;border-radius:15px;background:rgba(30,47,92,.6);border:1px solid #2C4272;
     display:flex;align-items:center;justify-content:center;
     font-family:'Unbounded',sans-serif;font-weight:800;font-size:25px;color:#fff;}
  .v.win{background:rgba(47,232,138,.14);border-color:rgba(47,232,138,.5);color:#2FE88A;}
  .v.net{background:#2FE88A;border-color:#2FE88A;color:#04231a;}
  .foot{display:flex;align-items:baseline;gap:18px;}
  .url{font-family:'Unbounded',sans-serif;font-weight:700;font-size:25px;color:#22D3EE;letter-spacing:.01em;}
  .tag{font-size:21px;color:#A9CFC5;font-weight:500;}
</style></head><body>
